<!DOCTYPE html>
<html>
<head>
    <title>Tic Tac Toee</title>
    <style>
        body {
            background-color: #222;
            color: white;
            font-family: sans-serif;
            text-align: center;
        }
        #game-board {
            display: grid;
            grid-template-columns: 100px 100px 100px;
            gap: 5px;
            margin: 0 auto;
            justify-content: center;
        }
        .box {
            width: 100px; 
            height: 100px;
            background: #444;
            font-size: 60px;
            cursor: pointer;
            line-height: 100px;
        }
    </style>
</head>
<body>
    <h1>Tic Tac Toee Game</h1>
    <p>Under 5kb challenge!</p>
    
    <div id="game-board">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>

    <script>
        let currentPlayer = "X";
        
        function makeMove(event) {
            let clickedBox = event.target;
            if (clickedBox.innerText == "") {
                clickedBox.innerText = currentPlayer;
                if (currentPlayer == "X") {
                    currentPlayer = "O";
                } else {
                    currentPlayer = "X";
                }
            }
        }
       
    </script>
</body>
</html>
