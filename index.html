<!DOCTYPE html>
<html>
<head>
    <title>Tic Tac Toe</title>
    <style>
        body {
            background-color: #222;
            color: white;
            font-family: sans-serif;
            text-align: center;
        }
        #game-board {
            display: grid;
            grid-template-columns: 100px 100px 100px;
            gap: 5px;
            margin: 0 auto;
            justify-content: center;
        }
        .box {
            width: 100px;
            height: 100px;
            background: #444;
            font-size: 60px;
            cursor: pointer;
            line-height: 100px;
        }
    </style>
</head>
<body>
    <h1>Tic Tac Toe Game</h1>
    <p id="status">Under 5kb challenge! X's turn.</p>
    
    <div id="game-board">
        <div class="box" onclick="makeMove(this, 0)"></div>
        <div class="box" onclick="makeMove(this, 1)"></div>
        <div class="box" onclick="makeMove(this, 2)"></div>
        <div class="box" onclick="makeMove(this, 3)"></div>
        <div class="box" onclick="makeMove(this, 4)"></div>
        <div class="box" onclick="makeMove(this, 5)"></div>
        <div class="box" onclick="makeMove(this, 6)"></div>
        <div class="box" onclick="makeMove(this, 7)"></div>
        <div class="box" onclick="makeMove(this, 8)"></div>
    </div>

    <script>
        let currentPlayer = "X";
        let board = ["", "", "", "", "", "", "", "", ""];
        let gameActive = true;

        const winConditions = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], // rows
            [0, 3, 6], [1, 4, 7], [2, 5, 8], // cols
            [0, 4, 8], [2, 4, 6]             // diagonals
        ];

        function makeMove(element, index) {
            if (board[index] == "" && gameActive) {
                board[index] = currentPlayer;
                element.innerText = currentPlayer;
                checkWin();
                
                if (gameActive) {
                    currentPlayer = currentPlayer === "X" ? "O" : "X";
                    document.getElementById("status").innerText = currentPlayer + "'s turn.";
                }
            }
        }

        function checkWin() {
            for (let i = 0; i < winConditions.length; i++) {
                let [a, b, c] = winConditions[i];
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    document.getElementById("status").innerText = currentPlayer + " WINS!!!";
                    gameActive = false;
                    return;
                }
            }
            if (!board.includes("")) {
                document.getElementById("status").innerText = "It's a draw!";
                gameActive = false;
            }
        }
    </script>
</body>
</html>
