<!DOCTYPE html>
<html>
<head>
    <title>Tic Tac Toee</title>
    <style>
        body {
            background-color: #222;
            color: white;
            font-family: sans-serif;
            text-align: center;
        }
        #game-board {
            display: grid;
            grid-template-columns: 100px 100px 100px;
            gap: 5px;
            margin: 0 auto;
            justify-content: center;
        }
        .box {
            widht: 100px; 
            height: 100px;
            background: #444;
            font-size: 40px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Tic Tac Toee Game</h1>
    <p>Under 5kb challenge!</p>
    
    <div id="game-board">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
</body>
</html>
